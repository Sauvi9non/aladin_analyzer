name: aladin daily snapshot

on:
  schedule:
    # UTC 기준 21:00 = 한국시간 06:00
    - cron: "0 21 * * *"
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: aladin-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run snapshot
        env:
          TTB_KEY: ${{ secrets.TTB_KEY }}
          ALADIN_DAILY_BUDGET: "4500"
        run: python aladin_collect.py snapshot

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "snapshot $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push

      - name: Summary
        if: always()
        run: tail -n 3 data/logs/collection_log.csv >> $GITHUB_STEP_SUMMARY
