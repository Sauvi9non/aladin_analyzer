services:
  airflow:
    image: apache/airflow:2.10.5
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      _PIP_ADDITIONAL_REQUIREMENTS: "duckdb"
    volumes:
      - ./dags:/opt/airflow/dags
      - ../data:/opt/airflow/data:ro
      - ./warehouse:/opt/airflow/warehouse
